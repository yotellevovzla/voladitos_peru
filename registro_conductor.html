<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Registro de Conductor</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voladitos">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-orange-950 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-2xl bg-slate-50/95 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/80 p-8 my-8 relative z-10">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-orange-600 to-amber-500 text-white rounded-2xl shadow-xl shadow-orange-600/30 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Registro de Conductor</h1>
      <p class="text-xs font-semibold text-slate-500 mt-1">Ingresa tus datos y carga multimedia para activar tu cuenta de flota</p>
    </div>

    <form id="form-registro-conductor" class="space-y-6">
      
      <!-- Sección 1: Datos Personales -->
      <div>
        <h2 class="text-xs font-black text-orange-600 uppercase tracking-widest mb-3 border-b border-slate-200 pb-1.5">
          1. Información Personal
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Completo</label>
            <input type="text" id="reg-nombre" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Carlos Pérez" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cédula / Identidad</label>
            <input type="text" id="reg-cedula" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="V-12345678" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha de Nacimiento</label>
            <input type="date" id="reg-fnac" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nro. de Licencia</label>
            <input type="text" id="reg-licencia" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Licencia de conducir" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Carnet de Circulación</label>
            <input type="text" id="reg-carnet" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Número de carnet de circulación" />
          </div>
        </div>
      </div>

      <!-- Sección 2: Datos del Vehículo -->
      <div>
        <h2 class="text-xs font-black text-orange-600 uppercase tracking-widest mb-3 border-b border-slate-200 pb-1.5">
          2. Especificaciones del Vehículo / Moto
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Placa</label>
            <input type="text" id="veh-placa" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-bold uppercase text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="ABC-123" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Marca</label>
            <input type="text" id="veh-marca" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Toyota, Honda, Empire..." />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Modelo</label>
            <input type="text" id="veh-modelo" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Corolla, YBR..." />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Color</label>
            <input type="text" id="veh-color" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Negro, Azul, Blanco..." />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Año</label>
            <input type="number" id="veh-anio" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="2022" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nro. Título de Propiedad</label>
            <input type="text" id="veh-titulo" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Número de título" />
          </div>
        </div>
      </div>

      <!-- Sección 3: Multimedia de Documentos -->
      <div>
        <h2 class="text-xs font-black text-orange-600 uppercase tracking-widest mb-3 border-b border-slate-200 pb-1.5">
          3. Carga Multimedia de Documentos
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Foto de Cédula</label>
            <input type="file" id="file-cedula" accept="image/*" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-3 py-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Foto de Licencia</label>
            <input type="file" id="file-licencia" accept="image/*" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-3 py-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Foto Carnet Circulación</label>
            <input type="file" id="file-carnet" accept="image/*" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-3 py-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 transition-all" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Foto Título Vehículo</label>
            <input type="file" id="file-titulo" accept="image/*" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-3 py-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 transition-all" />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Foto General del Vehículo / Moto</label>
            <input type="file" id="file-vehiculo" accept="image/*" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-3 py-2 text-xs text-slate-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-100 file:text-orange-700 hover:file:bg-orange-200 transition-all" />
          </div>
        </div>
      </div>

      <button type="submit" id="btn-guardar" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-500/30 text-sm tracking-wide transform active:scale-[0.99] border border-orange-400/20">
        Guardar Documentación y Enviar a Revisión 🚀
      </button>

    </form>

    <div id="status-message" class="mt-4 p-4 rounded-2xl text-xs text-center hidden font-bold tracking-wide border"></div>

  </div>

  <script src="js/registro_conductor.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
