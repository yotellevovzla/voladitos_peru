<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <!-- Luces sutiles de fondo -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Tarjeta Principal -->
  <div class="w-full max-w-md bg-white/95 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/80 p-8 relative z-10">
    
    <!-- Header Marca -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-blue-700 via-blue-600 to-indigo-500 text-white rounded-2xl shadow-xl shadow-blue-600/40 mb-3 border border-blue-400/30">
        <!-- Icono Carro SVG Profesional -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Voladitos</h1>
      <p class="text-[11px] font-bold text-blue-600 uppercase tracking-widest mt-1">Movilidad Inteligente y Segura</p>
    </div>

    <!-- Pestañas Conmutadoras -->
    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200/80">
      <button id="btn-tab-login" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-blue-700 shadow-sm border border-slate-200/50 transition-all duration-200">
        Iniciar Sesión
      </button>
      <button id="btn-tab-register" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">
        Crear Cuenta
      </button>
    </div>

    <!-- Formulario Login -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <div class="relative">
          <input type="email" id="login-email" required class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-inner" placeholder="nombre@correo.com" />
          <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative">
          <input type="password" id="login-password" required class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-inner" placeholder="••••••••" />
          <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-blue-600/35 text-sm tracking-wide transform active:scale-[0.99] border border-blue-400/20">
        Entrar a la Plataforma
      </button>
    </form>

    <!-- Formulario Registro -->
    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" id="reg-name" required class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-inner" placeholder="Ej. Carlos Mendoza" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="reg-email" required class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-inner" placeholder="tu@email.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" id="reg-password" required class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all shadow-inner" placeholder="••••••••" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Selecciona tu perfil</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="relative flex items-center justify-center p-3.5 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-blue-600 hover:bg-blue-50/50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/80 transition-all shadow-xs">
            <input type="radio" name="role" value="pasajero" checked class="sr-only" />
            <div class="flex items-center space-x-2">
              <svg class="w-4 h-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span class="text-xs font-bold text-slate-800">Pasajero</span>
            </div>
          </label>
          <label class="relative flex items-center justify-center p-3.5 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-blue-600 hover:bg-blue-50/50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/80 transition-all shadow-xs">
            <input type="radio" name="role" value="conductor" class="sr-only" />
            <div class="flex items-center space-x-2">
              <svg class="w-4 h-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4zM3 9l2-4h10l2 4m-14 0h14v8H3V9z"/></svg>
              <span class="text-xs font-bold text-slate-800">Conductor</span>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-blue-600/35 text-sm tracking-wide transform active:scale-[0.99] border border-blue-400/20">
        Crear Cuenta
      </button>
    </form>

    <div id="status-message" class="mt-4 p-3.5 rounded-2xl text-xs text-center hidden font-bold tracking-wide border"></div>

  </div>

  <script src="./js/index.js"></script>
</body>
</html>
