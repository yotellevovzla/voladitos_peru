<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <!-- Modal / Tarjeta Principal -->
  <div class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 p-8 relative overflow-hidden">
    
    <!-- Adorno gráfico sutil de fondo -->
    <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-blue-600/10 rounded-full blur-2xl"></div>

    <!-- Logotipo y Marca -->
    <div class="text-center mb-8 relative z-10">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 text-white rounded-2xl shadow-lg shadow-blue-600/30 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Voladitos</h1>
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mt-1">Tu viaje seguro en segundos</p>
    </div>

    <!-- Tabs Conmutadoras -->
    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200/60 relative z-10">
      <button id="btn-tab-login" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-blue-700 shadow-sm transition-all duration-200">
        Iniciar Sesión
      </button>
      <button id="btn-tab-register" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">
        Crear Cuenta
      </button>
    </div>

    <!-- Formulario Login -->
    <form id="form-login" class="space-y-4 relative z-10">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-medium text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" placeholder="usuario@voladitos.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-medium text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" placeholder="••••••••" />
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-blue-600/30 text-sm tracking-wide transform active:scale-[0.99]">
        Entrar a la App
      </button>
    </form>

    <!-- Formulario Registro -->
    <form id="form-register" class="space-y-4 hidden relative z-10">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-medium text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" placeholder="Ej. Juan Pérez" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-medium text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" placeholder="tu@email.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" id="reg-password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-medium text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" placeholder="••••••••" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Selecciona tu rol</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="relative flex items-center justify-center p-3 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-blue-600 hover:bg-blue-50/50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/80 transition-all">
            <input type="radio" name="role" value="pasajero" checked class="sr-only" />
            <span class="text-xs font-bold text-slate-700">🙋‍♂️ Pasajero</span>
          </label>
          <label class="relative flex items-center justify-center p-3 border-2 border-slate-200 rounded-2xl cursor-pointer hover:border-blue-600 hover:bg-blue-50/50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/80 transition-all">
            <input type="radio" name="role" value="conductor" class="sr-only" />
            <span class="text-xs font-bold text-slate-700">🚗 Conductor</span>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-blue-600/30 text-sm tracking-wide transform active:scale-[0.99]">
        Comenzar Ahora
      </button>
    </form>

    <div id="status-message" class="mt-4 p-3.5 rounded-2xl text-xs text-center hidden font-bold tracking-wide"></div>

  </div>

  <script src="./js/index.js"></script>
</body>
</html>
