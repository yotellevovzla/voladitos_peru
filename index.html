<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voladitos - App Oficial</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voladitos">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-orange-950 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <!-- Glow Naranja de Fondo -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-orange-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- OVERLAY DE INSTALACIÓN OBLIGATORIA PWA -->
  <div id="pwa-install-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-2xl z-[9999] flex items-center justify-center p-6 text-center">
    <div class="max-w-sm w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
      
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-3xl text-white shadow-xl shadow-orange-600/30 border border-orange-400/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
      </div>

      <div>
        <h2 class="text-2xl font-black text-white tracking-tight">Instala Voladitos</h2>
        <p class="text-xs text-slate-400 mt-2 leading-relaxed">
          Para garantizar la máxima seguridad y rendimiento, esta aplicación debe ejecutarse instalada en tu dispositivo.
        </p>
      </div>

      <button id="btn-pwa-install" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-600/35 text-sm tracking-wide border border-orange-400/20">
        Instalar Aplicación Oficial 🚀
      </button>

      <div id="ios-instructions" class="hidden text-left bg-slate-800/80 p-4 rounded-2xl border border-slate-700 text-[11px] text-slate-300 space-y-1">
        <p class="font-bold text-orange-400">En iPhone / iOS:</p>
        <p>1. Toca el botón <strong>Compartir</strong> en Safari.</p>
        <p>2. Selecciona <strong>"Agregar a inicio"</strong>.</p>
      </div>
    </div>
  </div>

  <!-- CONTENIDO DE LA APP -->
  <div id="app-content" class="w-full max-w-md bg-slate-50/95 backdrop-blur-2xl rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/80 p-8 relative z-10 hidden">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-600 via-orange-500 to-amber-500 text-white rounded-2xl shadow-xl shadow-orange-600/35 mb-3 border border-orange-400/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Voladitos</h1>
      <p class="text-[11px] font-bold text-orange-600 uppercase tracking-widest mt-1">Movilidad Inteligente</p>
    </div>

    <!-- Pestañas Conmutadoras -->
    <div class="flex bg-slate-200/70 p-1.5 rounded-2xl mb-6 border border-slate-300/60">
      <button id="btn-tab-login" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-orange-600 shadow-xs border border-slate-200/50 transition-all duration-200">
        Iniciar Sesión
      </button>
      <button id="btn-tab-register" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">
        Crear Cuenta
      </button>
    </div>

    <!-- Formulario Login -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="login-email" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="nombre@correo.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" id="login-password" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="••••••••" />
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-500/30 text-sm tracking-wide transform active:scale-[0.99] border border-orange-400/20">
        Entrar a la Plataforma
      </button>
    </form>

    <!-- Formulario Registro -->
    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" id="reg-name" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="Ej. Carlos Mendoza" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="reg-email" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="tu@email.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
        <input type="password" id="reg-password" required class="w-full bg-white border border-slate-300/80 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" placeholder="••••••••" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Selecciona tu perfil</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="relative flex items-center justify-center p-3.5 border-2 border-slate-300/80 bg-white rounded-2xl cursor-pointer hover:border-orange-500 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50/60 transition-all shadow-xs">
            <input type="radio" name="role" value="pasajero" checked class="sr-only" />
            <span class="text-xs font-extrabold text-slate-800">Pasajero</span>
          </label>
          <label class="relative flex items-center justify-center p-3.5 border-2 border-slate-300/80 bg-white rounded-2xl cursor-pointer hover:border-orange-500 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50/60 transition-all shadow-xs">
            <input type="radio" name="role" value="conductor" class="sr-only" />
            <span class="text-xs font-extrabold text-slate-800">Conductor</span>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-500/30 text-sm tracking-wide transform active:scale-[0.99] border border-orange-400/20">
        Crear Cuenta
      </button>
    </form>

    <div id="status-message" class="mt-4 p-3.5 rounded-2xl text-xs text-center hidden font-bold border"></div>

  </div>

  <script src="./js/index.js"></script>
  <script>
    let deferredPrompt;
    const overlay = document.getElementById('pwa-install-overlay');
    const appContent = document.getElementById('app-content');
    const btnInstall = document.getElementById('btn-pwa-install');
    const iosInstructions = document.getElementById('ios-instructions');

    function isRunningStandalone() {
      return (window.matchMedia('(display-mode: standalone)').matches) || 
             (window.navigator.standalone) || 
             document.referrer.includes('android-app://');
    }

    function checkPWAState() {
      if (isRunningStandalone()) {
        overlay.classList.add('hidden');
        appContent.classList.remove('hidden');
      } else {
        overlay.classList.remove('hidden');
        appContent.classList.add('hidden');
      }
    }

    window.addEventListener('DOMContentLoaded', checkPWAState);

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') console.log('App Instalada');
        deferredPrompt = null;
      } else {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          iosInstructions.classList.remove('hidden');
        } else {
          alert("Para instalar, abre el menú de tu navegador y selecciona 'Añadir a la pantalla de inicio'.");
        }
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
      });
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
