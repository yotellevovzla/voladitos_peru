<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Pedir Viaje</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 76px); width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Flotante / Transparente -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-6 py-4 flex items-center justify-between z-[1001] shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md shadow-blue-600/30">
        V
      </div>
      <span class="text-xl font-extrabold text-slate-900 tracking-tight">Voladitos</span>
    </div>

    <div class="flex items-center space-x-3">
      <div class="hidden sm:flex flex-col text-right">
        <span id="user-name" class="text-xs font-bold text-slate-800">Cargando...</span>
        <span class="text-[10px] text-slate-400 uppercase font-semibold">Pasajero</span>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold px-3.5 py-2.5 rounded-xl transition-all border border-slate-200">
        Salir
      </button>
    </div>
  </header>

  <div class="relative flex-1">
    <!-- Mapa Mapa Interactivo -->
    <div id="map"></div>

    <!-- Card Inferior Flotante de Reserva (Estilo App Movilidad) -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-white/95 backdrop-blur-xl p-6 rounded-3xl border border-white shadow-2xl z-[1000]">
      
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-extrabold text-slate-900 tracking-tight">Solicitar Viaje</h2>
        <span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded-full border border-blue-100">En tiempo real</span>
      </div>
      
      <div class="space-y-3">
        <!-- Indicador Origen -->
        <div class="relative flex items-center">
          <div class="w-3 h-3 bg-emerald-500 rounded-full border-2 border-white shadow-sm absolute left-3.5 z-10"></div>
          <input type="text" id="origen-txt" readonly value="Buscando ubicación..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-4 py-3 text-xs font-semibold text-slate-700 focus:outline-none" />
        </div>

        <!-- Indicador Destino -->
        <div class="relative flex items-center">
          <div class="w-3 h-3 bg-blue-600 rounded-full border-2 border-white shadow-sm absolute left-3.5 z-10"></div>
          <input type="text" id="destino-txt" placeholder="¿A dónde quieres ir?" class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-9 pr-4 py-3.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-600/10 transition-all" />
        </div>

        <!-- Estado del Viaje -->
        <div id="estado-viaje-box" class="hidden p-4 bg-blue-50/80 backdrop-blur-sm rounded-2xl border border-blue-100 text-center">
          <span class="text-[10px] text-blue-600 font-extrabold uppercase tracking-widest block mb-0.5">Estatus del Pedido</span>
          <span id="estado-viaje-texto" class="text-xs font-extrabold text-blue-900">Buscando un conductor cercano...</span>
        </div>

        <!-- Botón de Solicitud Primario -->
        <button id="btn-solicitar" onclick="solicitarViaje()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-xl shadow-blue-600/30 text-sm tracking-wide mt-2 transform active:scale-[0.99]">
          Confirmar Voladito 🚀
        </button>
      </div>
    </div>
  </div>

  <script src="js/pasajero.js"></script>
</body>
</html>
