<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Pedir Viaje</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ea580c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voladitos">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 76px); width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 px-6 py-4 flex items-center justify-between z-[1001] shadow-xl">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl flex items-center justify-center text-white font-black text-base shadow-lg shadow-orange-600/30 border border-orange-400/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      </div>
      <div>
        <span class="text-lg font-black text-white tracking-tight leading-tight block">Voladitos</span>
        <span class="text-[10px] text-orange-400 font-bold uppercase tracking-wider">Pasajero</span>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <span id="user-name" class="hidden sm:inline text-xs font-bold text-slate-300">Cargando...</span>
      <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-red-500/20 text-slate-300 hover:text-red-400 font-bold px-4 py-2.5 rounded-xl transition-all border border-slate-700/80">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <div class="relative flex-1">
    <div id="map"></div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-slate-50/95 backdrop-blur-2xl p-6 rounded-3xl border border-white/80 shadow-[0_20px_50px_-10px_rgba(0,0,0,0.4)] z-[1000]">
      
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-200/80">
        <h2 class="text-sm font-black text-slate-900 tracking-tight uppercase">¿A dónde vamos hoy?</h2>
        <span class="inline-flex items-center space-x-1.5 text-[10px] bg-orange-100 text-orange-700 font-extrabold px-3 py-1 rounded-full border border-orange-200">
          <span class="w-1.5 h-1.5 bg-orange-600 rounded-full animate-ping"></span>
          <span>En tiempo real</span>
        </span>
      </div>
      
      <div class="space-y-3">
        <div class="relative flex items-center">
          <div class="w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white shadow-md absolute left-4 z-10"></div>
          <input type="text" id="origen-txt" readonly value="Detectando tu ubicación..." class="w-full bg-white border border-slate-300/80 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-semibold text-slate-700 focus:outline-none shadow-xs" />
        </div>

        <div class="relative flex items-center">
          <div class="w-3.5 h-3.5 bg-orange-600 rounded-full border-2 border-white shadow-md absolute left-4 z-10"></div>
          <input type="text" id="destino-txt" placeholder="Ingresa punto de destino..." class="w-full bg-white border border-slate-300/80 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-bold text-slate-900 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-xs" />
        </div>

        <div id="estado-viaje-box" class="hidden p-4 bg-orange-50 rounded-2xl border border-orange-200 text-center shadow-xs">
          <span class="text-[10px] text-orange-600 font-black uppercase tracking-widest block mb-0.5">Estado de la solicitud</span>
          <span id="estado-viaje-texto" class="text-xs font-extrabold text-orange-950">Buscando un conductor cercano...</span>
        </div>

        <button id="btn-solicitar" onclick="solicitarViaje()" class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-500/30 text-sm tracking-wide mt-2 transform active:scale-[0.99] border border-orange-400/20">
          Confirmar Solicitud 🚀
        </button>
      </div>
    </div>
  </div>

  <script src="js/pasajero.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
