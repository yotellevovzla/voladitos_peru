<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Pasajero</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: calc(100vh - 73px); width: 100%; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header claro -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🚗💨</span>
      <h1 class="text-xl font-extrabold text-blue-700 tracking-tight">Voladitos</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="user-name" class="text-sm font-semibold text-slate-600">Cargando...</span>
      <button onclick="logout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3.5 py-2 rounded-xl transition-all border border-red-200">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <div class="relative flex-1">
    <div id="map"></div>

    <!-- Panel Flotante -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-lg bg-white/95 backdrop-blur-md p-6 rounded-3xl border border-slate-200 shadow-2xl z-[1000]">
      <h2 class="text-lg font-bold text-slate-900 mb-3">¿A dónde vamos hoy?</h2>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Origen</label>
          <input type="text" id="origen-txt" readonly value="Detectando GPS..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-blue-700 font-semibold" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Destino</label>
          <input type="text" id="destino-txt" placeholder="Escribe tu dirección de destino..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all" />
        </div>

        <div id="estado-viaje-box" class="hidden p-3.5 bg-blue-50 rounded-xl border border-blue-200 text-center">
          <span class="text-xs text-blue-600 font-bold block uppercase">Estado del Viaje</span>
          <span id="estado-viaje-texto" class="text-sm font-extrabold text-blue-800">Buscando conductor...</span>
        </div>

        <button id="btn-solicitar" onclick="solicitarViaje()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/25 text-base mt-2">
          Pedir un Voladito 🚀
        </button>
      </div>
    </div>
  </div>

  <script src="js/pasajero.js"></script>
</body>
</html>
