<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voladitos - Panel Driver</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    #map { height: calc(100vh - 76px); width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-6 py-4 flex items-center justify-between z-[1001] shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black text-sm shadow-md">
        ⚡
      </div>
      <div>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-tight">Voladitos Driver</h1>
        <span class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">● En Línea</span>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <span id="user-name" class="hidden sm:inline text-xs font-bold text-slate-700">Cargando...</span>
      <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold px-3.5 py-2.5 rounded-xl transition-all border border-slate-200">
        Salir
      </button>
    </div>
  </header>

  <div class="relative flex-1">
    <div id="map"></div>

    <!-- Card Flotante para Viajes Disponibles -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-white/95 backdrop-blur-xl p-6 rounded-3xl border border-white shadow-2xl z-[1000]">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-extrabold text-slate-900 uppercase tracking-wider">Solicitudes Cercanas</h2>
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
      </div>
      
      <div id="lista-viajes" class="space-y-3 max-h-64 overflow-y-auto pr-1">
        <p class="text-xs text-slate-400 text-center py-6 font-semibold">Esperando nuevas carreras...</p>
      </div>
    </div>
  </div>

  <script src="js/conductor.js"></script>
</body>
</html>
